<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turkuć</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: clamp(16px, 5vw, 48px);
        font-family: "Courier New", Courier, monospace;
        background-color: #000000;
        color: #08810e;
        font-size: clamp(16px, 2.2vw, 22px);
    }

    .section {
        width: 100%;
        padding: clamp(16px, 4vw, 28px);
        border: 1px solid #08810e;
        border-radius: 8px;
        overflow-wrap: anywhere;
        margin-top: 10px;
    }

    #flex-box {
        width: min(100%, 760px);
        margin: 0 auto;
    }

    h1 {
        margin: 0 0 24px;
        font-size: clamp(28px, 7vw, 48px);
        line-height: 1.1;
        overflow-wrap: anywhere;
    }

    .section p {
        margin: 0;
        padding: 12px 0;
        line-height: 1.45;
        border-bottom: 1px solid #064d0a;
    }

    .section p:last-child {
        border-bottom: 0;
    }

    .section span {
        font-weight: bold;
    }

    @media (max-width: 480px) {
        body {
            padding: 20px 14px;
        }

        h1 {
            margin-bottom: 18px;
        }

        .section p {
            padding: 10px 0;
        }
    }
    .chart-container {
        position: relative;
        width: 100%;
        height: 260px;
        margin-top: 16px;
    }

    @media (max-width: 480px) {
        .chart-container {
            height: 220px;
        }
    }

</style>
</head>
<body>

    <div id="flex-box">
        <h1>Turkuć podjadek</h1>
        <div class="section">
            <p>Hostname: <span id="hostname">-</span></p>
            <p>IP: <span id="ip">-</span></p>
            <p>Ping: <span id="ping">-</span> ms</p>
            <p>Download: <span id="download">-</span> MB/s</p>
            <p>Upload: <span id="upload">-</span> MB/s</p>
            <h5>Speedtest może pokazywać zaniżone wyniki</h5>
        </div>
        <div class="section">
            <h2>Czas połączenia TCP do 8.8.8.8:53</h2>
            <p>Ostatni pomiar: <span id="ping-status">Oczekiwanie…</span></p>
            <div class="chart-container">
                <canvas id="ping-chart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>

        async function getNetworkData() {

            const response = await fetch("/api/network/status1");

            const data = await response.json();

            document.getElementById("ip").textContent = data.ip;
            document.getElementById("ping").textContent = data.ping;
            document.getElementById("hostname").textContent = data.hostname;
            document.getElementById("download").textContent = data.download;
            document.getElementById("upload").textContent = data.upload;

        }

        getNetworkData();
        const pingStatus = document.getElementById("ping-status");
const maxPoints = 60;

const pingChart = new Chart(document.getElementById("ping-chart"), {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            label: "Czas TCP (ms)",
            data: [],
            borderColor: "#19c933",
            backgroundColor: "rgba(25, 201, 51, 0.15)",
            fill: true,
            tension: 0.25,
            spanGaps: false
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
            x: {
                ticks: { color: "#08810e", maxTicksLimit: 6 },
                grid: { color: "rgba(8, 129, 14, 0.2)" }
            },
            y: {
                beginAtZero: true,
                title: { display: true, text: "ms", color: "#08810e" },
                ticks: { color: "#08810e" },
                grid: { color: "rgba(8, 129, 14, 0.2)" }
            }
        },
        plugins: {
            legend: { labels: { color: "#08810e" } }
        }
    }
});

async function measurePing() {
    try {
        const response = await fetch("/api/network/ping", { cache: "no-store" });
        const result = await response.json();
        const now = new Date().toLocaleTimeString();

        pingChart.data.labels.push(now);
        pingChart.data.datasets[0].data.push(
            response.ok ? result.ping : null
        );

        if (pingChart.data.labels.length > maxPoints) {
            pingChart.data.labels.shift();
            pingChart.data.datasets[0].data.shift();
        }

        pingChart.update();
        pingStatus.textContent = response.ok
            ? `${result.ping} ms`
            : "Brak połączenia";
    } catch {
        pingStatus.textContent = "Błąd pobierania pomiaru";
    }
}

measurePing();
setInterval(measurePing, 5_000);

    </script>

</body>
</html>
